name: Gerar cobrinha do gráfico de contribuições

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gera o SVG da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: plautoholtzadvogados-lang
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Salva o SVG no repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza a cobrinha do gráfico de contribuições"
          file_pattern: dist/*.svg
